math_with_judge:
  resources_servers:
    math_with_judge:
      entrypoint: app.py
      url: https://gym-dev.swissai.svc.cscs.ch/math_with_judge
      # Temporary wire compatibility for the deployed pre-b1e0 Gym service. Remove after it accepts null usage details.
      legacy_response_usage_details_as_zero: true
      judge_model_server:
        type: responses_api_models
        name: policy_model
      judge_responses_create_params: {
        input: []
      }
      # The deployed service controls judging; this local setting does not reconfigure it.
      should_use_judge: false
      domain: math
      verified: false
      description: OpenMathReasoning math verifier, remote on breithorn k8s
math_with_judge_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: math_with_judge
      model_server:
        type: responses_api_models
        name: policy_model
      # The hosted Math verifier can transiently return 502 during a deployment.
      # This opt-in retries only its idempotent /verify request.
      retry_verify_on_502: true
      datasets:
      - name: train
        type: train
        jsonl_fpath: resources_servers/math_with_judge/data/OpenMathReasoning_train.jsonl
        huggingface_identifier:
          repo_id: nvidia/Nemotron-RL-math-OpenMathReasoning
          artifact_fpath: train.jsonl
        license: Creative Commons Attribution 4.0 International
      - name: validation
        type: validation
        jsonl_fpath: resources_servers/math_with_judge/data/OpenMathReasoning_aime24_validation.jsonl
        huggingface_identifier:
          repo_id: nvidia/Nemotron-RL-math-OpenMathReasoning
          artifact_fpath: validation.jsonl
        license: Apache 2.0
      - name: example
        type: example
        jsonl_fpath: resources_servers/math_with_judge/data/example.jsonl
