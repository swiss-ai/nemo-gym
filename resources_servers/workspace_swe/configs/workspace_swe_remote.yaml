workspace_swe:
  resources_servers:
    workspace_swe:
      entrypoint: app.py
      url: https://gym-dev.swissai.svc.cscs.ch/workspace_swe
      # Temporary wire compatibility for the deployed pre-b1e0 Gym service. Remove after it accepts null usage details.
      legacy_response_usage_details_as_zero: true
      domain: coding
      verified: false
      description: Interactive SWE env — per-session workspace, shell + file edits, hidden-test reward.
workspace_swe_gymnasium_agent:
  responses_api_agents:
    gymnasium_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: workspace_swe
      model_server:
        type: responses_api_models
        name: policy_model
      max_steps: 12
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/workspace_swe/data/example.jsonl
