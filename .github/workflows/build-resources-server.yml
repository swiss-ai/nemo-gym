name: Build resources-server image

on:
  push:
    branches: [swissai-k8s]
    paths:
      - docker/**
      - .dockerignore
      - .github/workflows/build-resources-server.yml
      - nemo_gym/**
      - resources_servers/math_with_judge/**
      - resources_servers/blackjack/**
      - resources_servers/gymnasium/**
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Build each (server, arch) on a native runner, push arch-suffixed tags.
  build:
    strategy:
      fail-fast: false
      matrix:
        server: [math_with_judge, blackjack]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: img
        run: echo "image=ghcr.io/${{ github.repository }}/$(echo '${{ matrix.server }}' | tr '_' '-')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.resources-server
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            SERVER=${{ matrix.server }}
          tags: ${{ steps.img.outputs.image }}:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=rs-${{ matrix.server }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=rs-${{ matrix.server }}-${{ matrix.arch }}

  # Stitch the arch tags into one multi-arch manifest per server.
  merge:
    needs: build
    strategy:
      matrix:
        server: [math_with_judge, blackjack]
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          IMAGE="ghcr.io/${{ github.repository }}/$(echo '${{ matrix.server }}' | tr '_' '-')"
          docker buildx imagetools create \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
            "$IMAGE:${{ github.sha }}-amd64" \
            "$IMAGE:${{ github.sha }}-arm64"
